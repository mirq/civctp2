# Builds the Amiga (68060, WarpOS, MorphOS, the launcher) and Linux programs.
#
# Every push and pull request: the programs are uploaded as workflow
# artifacts (Actions tab -> the run -> Artifacts).
# A pushed tag v<version> (git tag v0.2 && git push fork v0.2), or a manual
# run with "release" set, also packs the release archives
# (tools/ci/package-release.sh) and publishes them as the GitHub release
# "Call to Power II for Amiga <version>" with tools/ci/release-notes.md:
#   CTP2-Amiga-<version>.lha                everything but the original data
#   CTP2-Amiga-<version>-programs-only.lha  to update an installed copy
#   CTP2-Linux-x86_64-<version>.tar.gz
#
# The 68k and WarpOS cross compilers come from the amigadev/crosstools images;
# the generated sources (database records, SLIC/LDL parsers) and the host tool
# elf2warpos are made on the runner first, since the images point gcc/g++/ld
# at the cross compiler. MorphOS builds on the runner itself with the MorphOS
# SDK's Debian package (ppc-morphos-gcc 11.3 in /gg), checksum pinned.

name: Build and release

on:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a release with this tag (e.g. v0.2); empty = build only'
        required: false
        default: ''

permissions:
  contents: read

env:
  # The toolchain images, pinned by digest: the tags move, and a newer
  # m68k-amigaos image builds differently. Replace them to change compilers.
  # m68k-amigaos of 2025-12-29: Bebbo gcc 6.5.0b 251015095727 + libnix
  IMAGE_68K: amigadev/crosstools@sha256:dbdd5424824bf90361e14590263d685e37537f2cb3268d4c378b60f721befd84
  # ppc-amigaos: adtools ppc-amigaos-gcc 11.5
  IMAGE_WOS: amigadev/crosstools@sha256:de69c1ddd5ea77c7202f50304919b45b94d45060a11f70eaf3767175cd73f8b3
  MOS_SDK_URL: https://bigfoot.morphos-team.net/test/morphos-sdk_20230510-1_amd64.deb
  MOS_SDK_SHA256: 2e5e687a0ba1cb62a554110d97ccd4f1986ae2262e1212acfb02eda7fab2093a
  MOS2WOS_URL: https://aminet.net/dev/gcc/gcc-mos2wos.lha

jobs:
  amiga:
    name: Amiga ${{ matrix.title }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: 68k
            title: 68060 (+ launcher)
            artifact: amiga-68060
            makefile: Makefile.amiga68k
            exe: bin/amiga/ctp2.060
            files: |
              bin/amiga/ctp2.060
              bin/amiga/CTP2
              build/amiga68k/ctp2.debug
          - target: warpos
            title: WarpOS
            artifact: amiga-warpos
            makefile: Makefile.warpos
            exe: bin/amiga/ctp2.wos
            files: |
              bin/amiga/ctp2.wos
              build/warpos/ctp2.debug.elf
          - target: morphos
            title: MorphOS
            artifact: amiga-morphos
            makefile: Makefile.morphos
            exe: bin/amiga/ctp2.mos
            files: |
              bin/amiga/ctp2.mos
              build/morphos/ctp2.debug
    steps:
      - uses: actions/checkout@v4

      - name: Host tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq byacc flex lhasa

      - name: Generated sources (host)
        run: make -f ${{ matrix.makefile }} YACC=byacc -j$(nproc) gen

      - name: MOS2WOS SDK and elf2warpos (host)
        if: matrix.target == 'warpos'
        run: |
          mkdir -p build/mos2wos && cd build/mos2wos
          curl -fsSL --retry 3 -o gcc-mos2wos.lha "$MOS2WOS_URL"
          lhasa xq gcc-mos2wos.lha
          tar xf gcc-mos2wos.tar
          test -f gg/ppc-warpos/lib/startupwos.o
          cd ../..
          make -f Makefile.warpos MOS2WOS_ROOT=$PWD/build/mos2wos/gg build/host/elf2warpos

      - name: MorphOS SDK
        if: matrix.target == 'morphos'
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/morphos-sdk.deb" "$MOS_SDK_URL"
          echo "$MOS_SDK_SHA256  $RUNNER_TEMP/morphos-sdk.deb" | sha256sum -c -
          sudo apt-get install -y -qq "$RUNNER_TEMP/morphos-sdk.deb"
          /gg/bin/ppc-morphos-gcc --version | head -1

      - name: Cross build (MorphOS, on the runner)
        if: matrix.target == 'morphos'
        run: |
          make -f ${{ matrix.makefile }} YACC=false -j$(nproc)
          ls -la ${{ matrix.exe }}

      - name: Cross build (in the toolchain image)
        if: matrix.target != 'morphos'
        run: |
          case "${{ matrix.target }}" in
          68k)     image=$IMAGE_68K; args="PREFIX=/opt/m68k-amigaos" ;;
          warpos)  image=$IMAGE_WOS; args="WOS_TOOLCHAIN_BIN=/opt/ppc-amigaos/bin MOS2WOS_ROOT=/src/build/mos2wos/gg HOSTCC=false" ;;
          esac
          docker run --rm -v "$PWD:/src" -w /src "$image" \
            make -f ${{ matrix.makefile }} $args YACC=false -j$(nproc)
          sudo chown -R "$(id -u):$(id -g)" build bin
          ls -la ${{ matrix.exe }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsdl2-dev libsdl2-mixer-dev libsdl2-image-dev \
            libtiff-dev byacc flex binutils-gold automake autoconf libtool unzip

      - name: Build
        run: |
          ./autogen.sh
          CFLAGS="-O2 -w -Wno-implicit-function-declaration -fuse-ld=gold" \
          CXXFLAGS="-O2 -w -fpermissive -fuse-ld=gold" \
            ./configure --enable-silent-rules
          # A parallel make can miss generated sources (it can take two or
          # three passes); a serial one last.
          make -j$(nproc) || make -j$(nproc) || make -j$(nproc) || make
          ls -la ctp2_code/ctp/ctp2 ctp2_code/mapgen/.libs/*.so

      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            ctp2_code/ctp/ctp2
            ctp2_code/mapgen/.libs/*.so
          if-no-files-found: error
          include-hidden-files: true

  release:
    name: Publish release
    needs: [ amiga, linux ]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: LHa for UNIX
        run: |
          git clone --depth 1 https://github.com/jca02266/lha.git "$RUNNER_TEMP/lha"
          cd "$RUNNER_TEMP/lha"
          autoreconf -is && ./configure -q && make -s -j$(nproc)
          sudo install src/lha /usr/local/bin/lha
          lha --version

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package
        run: |
          tag="${{ inputs.release }}"
          [ -n "$tag" ] || tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          tools/ci/package-release.sh amiga "$version" dist \
            artifacts/amiga-68060/bin/amiga/ctp2.060 \
            artifacts/amiga-68060/bin/amiga/CTP2 \
            artifacts/amiga-warpos/bin/amiga/ctp2.wos \
            artifacts/amiga-morphos/bin/amiga/ctp2.mos
          tools/ci/package-release.sh linux "$version" dist \
            artifacts/linux-x86_64/ctp/ctp2 \
            artifacts/linux-x86_64/mapgen/.libs/*.so
          (cd dist && sha256sum * > SHA256SUMS.txt)
          sed "s/@VERSION@/$version/g" tools/ci/release-notes.md > "$RUNNER_TEMP/notes.md"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Call to Power II for Amiga $VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "$title" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" dist/* --target "$GITHUB_SHA" --title "$title" \
              --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
          fi
